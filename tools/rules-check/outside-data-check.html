const ITEMS=[["SALT-train-1427", "SALT sentence", "Gavumenti ya Uganda eri mu kukola ku tteeka eppya mu bisomesebwa.", "The government of Uganda is working on a new education policy."], ["WIKI-01577-03", "Wikipedia: Diana Atwine", "Yasomera ku Bweranyangi Girls' Senior Secondary School mu mutendera gwa Siniya ogusookerwako ogwa (O-Level) ne Mount Saint Mary's College Namagunga ku mutendera gwa Siniya eya waggulu ogwa (A-Level), n'atikkirwa Dipuloma eya High School Diploma . Yaweebwa ekifo ku Yunivasite y'e Mbarara ey'ebyeddagala eya Mbarara University School of Medicine, gye yatikirwa Diguli eyookubiri mu by'eddagala n'okulongoosa eyitibwa Bachelor of Medicine and Bachelor of Surgery Okugoberera ekyo, essira yalissa ku ddagala ly'omunda era n'atikkirwa Diguli eya Master of Medicine ku Yunivasite y'emu.", ""], ["SALT-train-13550", "SALT sentence", "Yitale ekola abantu ebitundu bibiri ku buli kikumi byokka ku bantu abali mu nsi yonna.", "Italy accounts for only 2% of the global population."], ["SALT-train-2026", "SALT sentence", "Bannannyini booda booda ez'obwannanyini balina okugoberera amateeka agafuga enkozesa y'enguudo.", "Private bodaboda owners should also adhere to the road safety guidelines"], ["WIKI-03253-01", "Wikipedia: Sara Mulindwa", "Sara Mulindwa oba oluusi awandiikibwa nga Sarah Mulindwa munnayuganda enzaalwa y’e Bungereza, asinziirira mu Bungereza munnamawulire, omukozi wa'oku ttivvi era omusomesa w’ebyobulamu .", ""], ["WIKI-01889-04", "Wikipedia: Aloysius Bugingo", "Bugingo alina ddiguli esooka mu by’eddiini, ne satifikeeti mu nkola y'ekikulisitaayo ey'okuzzaamu amaanyi n'okubudaabuda, gye yafuna nga 28 mu Gwomukaaga gwa 2019 okuva mu yunivaasite ya Kayiwa International. Yaweebwa awaadi olw’ettoffaali lyatadde ku nkulaakulana y'ekkanisa y'abalokole mu Uganda era yeeyasinga mu mwaka gwe yatikkirwamu.", ""], ["WIKI-01715-08", "Wikipedia: Linda Agnes Auma", "Mu 2016 yanoonya ekifo ky’omubaka omukyala owa munisipaali y’e Lira ku tikiti ya National Resistance Movement kyokka n’awangulwa mu kamyuufu. Joyce Ongom owa Uganda People's Congress (UPC) yali wakuwangula ekifo ky'omubaka wa Palamenti.", ""], ["SALT-train-20078", "SALT sentence", "Abantu abamu beekalakaasa olw'amateeka amapya pulezidenti ge yassaawo.", "Some people are protesting against the president's new laws."], ["WIKI-04042-04", "Wikipedia: Samite", "Samite era y’omu ku batandikawo ekibiina ekitali kya magoba ekya Musicians for World Harmony, ekyanjula emiziki mu bamulekwa mu Afrika. Samite ye yatandikawo ekitongole ekigaba obuyambi ne mukyala we omugenzi Joan. Samite era agabana n’okusomesa ku byeyayitamu mu Uganda n’okubeera abundabunda olw'ebyobufuzi.", ""], ["SALT-train-4836", "SALT sentence", "Okuvaako kw'amasannyalaze kujja kweyongera olw'okukendeera kw'amazzi mu nnyanja Nalubaale.", "Load shedding will increase due to the decrease in water levels of Lake Victoria."], ["SALT-train-510", "SALT sentence", "Ttiimu ewooza omusolo ku nsalo nkambwe nnyo.", "The revenue authority team at the border is very tough."], ["SALT-train-8266", "SALT sentence", "Abantu bakubiriziddwa okwetaba mu byobulimi.", "People have been advised to engage in Agricultural activities."], ["WIKI-00156-01", "Wikipedia: EDAGALA LY'AMANNYI G'EKISAJJA ERYEKINANSI", "Bwe wetegereza ennyo mu masajja ku bo abamu balina obuzibu bwobutamalaako songa ateera ne mu Africayonna abasajja bangi bafuse nsindika njake ensangi zino .", ""], ["SALT-train-20356", "SALT sentence", "Yali mumanyifu nnyo ku ssomero.", "She was very popular in school."], ["WIKI-05180-02", "Wikipedia: Nuno Gomes Nabiam, munnabyabufuzi", "Gomes Nabiam yasomera ku Kwame Nkrumah National High School. Yamaliriza diguli ye mu Higher Institute of Civil Aviation Engineering e Kyiv, Ukraine, era n’aweebwa sikaala okusoma eby’ennyonyi mu 1986. Oluvannyuma Gomes Nabiam yasomera mu Amerika, gye yafunira diguli eyookubiri mu by’okuddukanya bizinensi.", ""], ["SALT-train-15942", "SALT sentence", "Yafuna empuku omw'okusula.", "She found a cave to live in."], ["WIKI-05075-48", "Wikipedia: Ekika ky'ente", "Mutabani wa Katongole ayitibwa Kajojo yali asigadde ku kyalo Kamwanga okulirana e Kamusoga enti mukyala we yali mulwadde ddala. Mukyala wa Kajojo bweyamala okufuna, Kajojo n’omwana we Luteete nebagoberera bagandabe era nabo nebasenga ku Mulema.", ""], ["WIKI-03338-01", "Wikipedia: Monica Birwinyo", "Monica Jacobs Birwinyo (yazaalibwa nga 4 Ogwomukaaga 1990) Munnayuganda, muzannyi wa ffilimu, era muwereeza wa ku telefayina. Yatandiika emirimu gye egy'okuzannya filimu nga yatandiika n'akuzannya bifo bitonotono mpolampola n'agenda ng'alinnya mu bifo ebinene nga Imbabazi, The Pardon ne Irene Kulabako's Beauty to Ashes era n'akazannyo ak'obutundu akalagibwa ku NBS aka Because of U. 5@home, the Honorablez, Mela ne Zansanze omuzannyo gw'oku siteegi.", ""], ["SALT-train-21543", "SALT sentence", "Gavumenti ezimba ebbibiro ly'amasannyalaze eppya ku mugga ogwo.", "The government is constructing a new power dam on that river."], ["WIKI-03391-02", "Wikipedia: Victoria Nyanjura", "Nyanjura yazzaalibwa mu Disitulikittu y'e Oyam, mu bitundu bye Lango, mu Mambuka ga Uganda. Yasomera Pulayimale mu masomero g'abulijjo. Yafuna Dipulooma ya Siniya okuva mu St. Mary's College Aboke, mu Disitulikitti ye Kole.", ""], ["SALT-train-20500", "SALT sentence", "Ennyimba z'eddiini ezisinga obungi ze mmanyi ziri mu Lungereza.", "Most of the hymns I know are in English."], ["WIKI-00624-03", "Wikipedia: Ebigendererwa by’ensi eby’enkulakulana", "Nga 19/07/2014, ekibinja ky’abantu abaali ab’okukola ku bigendererwa bino okuva mu Lukiiko Ttabamiruka olw’Ekibiina ky’Amawanga amagatte kyaweereza ekiwandiiko ekirimu ebiteeso byakyo eri Olukiiko luno. Ekiwandiiko ky’ebiteeso byabwe kyalimu ebigendererwa kkumi na musanvu (17) n’ebitunuuliddwa mu bigendererwa bino kikumi mu nkaaga mu mwenda (169) nga byali bitwaliramu kumpi buli kyetaagisa okusobola okutuuka ku nkulakulana eno egenda mu aaso / eteddirira. Mu bino mwalimu okukomya enjala, n’obwavu, okutumbula eby’obulamu n’ebyenjigiriza , okufuula ebibuga ebifo ebyesiimisa, okumalawo obuzibu bw’enkyukakyuka mu mbeera z’obudde, n’okukuuma zi ssemayanja wamu n’ebibira. Nga 05/12/2014, olukiiko ttabamiruka olw’ekibiina ky’amawanga amagatte lwakkiriza ekyo ekyasalibwawo ssaabawandiisi mu alipoota ye gye yakola oluvannyuma lw’okwekenneenya ebiteeso by’ekibinja ekikozi ekyasalawo ku bigendererwa bino era ne kikakasibwa nti enteekateeka yaakyo yejja okugobererwa.", ""], ["SALT-train-15284", "SALT sentence", "Singa okiraga mu ngeri yonna nti olinamu obusosoze, osazibwamu.", "Any slight deviation towards ethnicity and you are disqualified."], ["WIKI-00700-42", "Wikipedia: Obuziba(atoms)", "Waliwo endagakintu 118 ezimanyiddwa nga ku zino ezisinga ziriwo mu butonde ate ezimu nga zikoleddwa muntu. Endagakintu ze tumanyi ziragibwa mu mweso gw’enkyusabuziba(Chemical table of elements nga buli ndagakintu efundiwaziddwa n’akabonero ak’enkyusabuziba(chemical symbol).", ""], ["SALT-train-17373", "SALT sentence", "Abantu abamu bafa olw'obutateekebwamu mangu musaayi.", "Some people die because they don't receive blood in time."], ["WIKI-05858-01", "Wikipedia: Fabian Kizito", "Fabian Derrick Subi Kizito (yazaalibwa nga 26 Ogwomusanvu 1990) muzannyi wa mupiira omukugu era munnaUganda nga azannyira nga omuteebi mu tiimu ya SV TEC .", ""], ["WIKI-04437-01", "Wikipedia: Uganda Revenue Authority", "Uganda Revenue Authority ( URA ) kitongole kya gavumenti ekisolooza omusolo ekyatandikibwawo Palamenti ya Uganda. Kikolera wansi wa Minisitule y’Eby'ensimbi, Okuteekateeka n’Enkulaakulana y’Eby'enfuna, URA evunaanyizibwa ku kusa mu nkola, okwekeneenya, okukung’aanya, n’okubala emisolo egy’enjawulo egyateekebwawo mu Uganda .", ""], ["SALT-train-18425", "SALT sentence", "Yatuula wansi n'anywa giraasi ye ey'amazzi.", "He sat down and drank his glass of water."], ["SALT-train-21703", "SALT sentence", "Abasomesa abamu basazeewo okukola emirimu egya lejjalejja.", "Some teachers have resorted to informal employment."], ["WIKI-01836-02", "Wikipedia: Wilson Bugembe", "Bugembe yazaalibwa mu mwaka 1984 eMasaka nga bazadde be ye Omwami n'Omukyala ba Kirabira. Bugembe bakadde be baafa nga akyali muto ekyamuviirako okubeera ku nguudo okumala ebbanga. Yasobola okusoma okutuuka ku Yunivaasite naye yasomako olusoma lumu naawanduka.", ""], ["WIKI-00008-02", "Wikipedia: Buganda", "Buganda erina ebyafaayo bingi ebiviira ddala eyo mu mirembe egy'edda ennyo. Ssekabaka eyasooka Kato Kintu ye yagireetera okwegatta awamu eyo mu kyasa eky'ekkumi n'ebina, era nga ye yatandikawo ennono y'Abaganda bazzukulu ba Kintu. Buganda yagenda yeeyongera amaanyi n'efuukira ddala obwakabaka obumu ku businga obunene n'okuba obw'amaanyi mu buvanjuba bwa Afirika wakati w'ekyasa eky'ekkumi n'omusanvu n'ekyekkumi n'omwenda. Mu biseera by'obufuzi bw'amatwale, Buganda yagezaako okulwana obutaggyibwako bwetwaze naye Abangereza ne bagisinza amaanyi. Bwe kityo nno Buganda yafuulibwa entabiro y'obufuzi bw'amatwale mu Uganda mu mwaka gwa 1894. Erinnya Uganda, mu Luswayiri eritegeeza Buganda Abangereza lye baasalawo okuyita ettwale lino. Mu bufuzi obw'amatwale Abaganda bangi baafuna obwami obw'okuba ababaka b'abafuzi b'amatwale mu bitundu eby'enjawulo era Buganda yayitimuka nnyo mu kulima ppamba n'emmwanyi.", ""], ["WIKI-02854-04", "Wikipedia: Sarah Nyendwoha Ntiro", "Yasooka kukolera mu ssomero lya Kyebambe Girls eriri Fort Portal. Mu 1955, yegatta ku ssomero lya Gayaza High School. Oluvannyuma yava mu ssomero lya Gayaza High School neyeegatta ku Duhaga Junior Secondary School (DJSS) mu Hoima gye yasomesa okumala emyaka ebiri nga tanawumula mulimu gwe ogw'obusomesa 1958.", ""], ["WIKI-00802-04", "Wikipedia: Okwefumiitiriza(Critical thinking)", "Okwefumiitiriza (critical thinking) kitegeeza “kulowooza ku kulowooza”. Kino kitegeeza nti okwefumiitiriza kulowooza okuyingira mu buziba bw’ekintu oba embeera nga tonnasalawo oba nga tonnakola kintu kyonna.", ""], ["SALT-train-1024", "SALT sentence", "Ebibiina by'ebyobufuzi birina okwekubamu ttooki okwetereeza.", "Political parties should evaluate themselves to improve."], ["WIKI-04130-07", "Wikipedia: Elizabeth Paula Napeyok", "- Omubaka wa Bufalansa, Cuba, ne Buyindi: Okusooka okuteekebwa mu bifo eby’obubaka mwalimu okuweereza ng’Omubaka wa Uganda mu Cuba ne Bufalansa, n’okubeera Kaminsona Omukulu mu Buyindi .", ""], ["SALT-train-23725", "SALT sentence", "Mu Uganda ekisanja ky'obwa pulezidenti kya myaka etaano.", "Uganda's presidential term is five years."], ["SALT-train-3087", "SALT sentence", "Abantu balina okutegeezebwa ku mateeka nebigobererwa eby'ekitundu.", "People should be informed about the rules and regulations for society."], ["WIKI-06315-04", "Wikipedia: Brian Mululi Mayanja", "Okuva mu 2020 okutuuka mu 2021, yazannyira Kitara FC. Mu sizoni ya 2022 - 2023, Mayanja yazannyira Jinja North United nga tannaba kwegatta ku Mbarara City mu 2023 okumala akaseera katono. Oluvannyuma yagenda e Tanzania gye yazannyira Africa Lyon ne Mtibwa Sugar. Mu 2024, Mayanja yeegatta ku Buhimba United Saints gye yazannyira mu liigi ya FUFA Big League.", ""], ["SALT-train-3201", "SALT sentence", "Abakozi b'amateeka bawandiika n'okuyisa amateeka.", "Legislators write and pass laws."], ["WIKI-01287-02", "Wikipedia: Ensengekera y'ekitambuzamusaayi(the Blood circulatory system)", "Okutwalira awamu ensengekera y’ekitambuzamusaayi ebunyisa omusaayi okwetoloola omubiri gwo okuyita mu mutima , Atari ne veyini okuweereza okisigyeni n’ebiriisa mu bitundu by’omubiri n’obutaffaali n’okujja ebizambi(waste) mu mitundi eby’enjawulo.Bivudde mu Kitabo kya Muwanga Charles \"Essomabiramu(Biology)\"", ""], ["WIKI-00802-08", "Wikipedia: Okwefumiitiriza(Critical thinking)", "Omuntu omw’efumiitiriza bw’asoma ekitabo ka tugambe ekya “Zinunula Omunaku”, asooka n’asoma emiko egisooka, n’asoma ku muwandiisi, n’alyooka asalawo oba asome ekitabo kino kyonna.", ""], ["SALT-train-6306", "SALT sentence", "Baazimbira abawagizi baabwe ekisaawe ky'omupiira gw'ebigere.", "They constructed a football stadium for their fans."], ["SALT-train-15503", "SALT sentence", "Tekirina buzibu singa abantu bangi beenyigira mu by'obufuzi.", "There is no serious case for wide-scale politics."], ["WIKI-03617-04", "Wikipedia: James Munange Ogoola", "Ebiseera bya Ogoola eby'eddembe yabimala nga ali mu bya kusinza. Yakamaliriza okukyusa ebiwandiiko bya Bayibuli ebisinganibwa mu Suula Empya ng'abizza mu lulimirirwe olwa Lusamia.", ""], ["WIKI-05397-02", "Wikipedia: Robert Mugabe Kakyebezi", "Bweyali omuto, bazadde be basenguka ne bagenda mu disitulikiti kati eyitibwa ey’e Kazo mu kyalo kye Kantaganya, mu muluka gwe Kanoni, nga eno oluvannyuma ne yegatta ku Kantaganya primary school gye yamalira ekibiina eky'omusanvu.", ""], ["WIKI-02040-01", "Wikipedia: Cherif Al-Hassane Aidara", "Cherif Al-Hassane Aidara (yazalibwa mu 1917 mu Timbedra Mauritaniya: Naafa mu mwezi gwa ntenvu omwaka 2011 mu Darou Hidjiratou, Senegal.) yalimu omusaayi omumauritaniya nomusenegal era nga mukulembeze mu diini lya Shi'i nga we Tinjaniya Tariqa.", ""], ["WIKI-01600-03", "Wikipedia: Jessica Alupo", "Alupo yakolako ogw'okutunda ebyokulya ku dduuka ly'essomero nga tanaba kugenda okusoma koosi y'okutendekebwa byakubeera muserikale ku ttendekero lya Uganda Junior Staff College e Jinja. Alina Diguli ta Bachelor of Arts in political science and linguistics, gye yafuna mu 1997 okuva ku Yunivasite ye Makerere. Diguli ye ey'okubiri eyasooka, yali Master of Arts in international relations and diplomacy, nga nayo yagifunira ku Yunivasite y'e Makerere mu 2008. Alina ne Dipuloma mu by'okudukanya n'okulabirira embeera z'abantu gyeyafuna mu 2008 okuva kutendekero lya Uganda Management Institute (UMI). Diguli ye ey'okubiri mu by'okudukanya n'okulabirira embeera z'abantu yabifuna mu 2009, okuva ku Yunivasite ye Makerere.", ""], ["WIKI-01896-03", "Wikipedia: Anne Kansiime", "Okutandikira mu 2007, ng'akyasomera ku yunivasite y'e Makerere, Kansiime yatandika okwetaba mu kuzannya katemba n'ekibiina ky'okusiteegi kyebaali bayita 'Theatre Factory, abaazannyira nga ku Uganda National Theatre mu kibuga kya Kampala wakati. Ekibiina kino ekya Theatre Factory bwekyasaanawo, yeegata ku kyebaali bayita Fun Factory, ekyali kikididde kiri mu bigere. Ekibiina kino kizannya buli Lwakuna ekawungeezi. Obutundu obusinga okunyuma baabulaga nga ku mukutu gwa NTV Uganda mu pulogulaamu ya Barbed Wire ey'oku ttivi eyakyusibwa erinya oluvannyuma nebaguyita U-Turn. Yakwatagana ne Brian Mulondo nga bakola nga bakondakita ba takisi abasoya ebibuuzo mu pulogulaamu y'obutundu eyitibwa MiniBuzz nga bafuna embeera gyebakubaganyako ebirowoozo nga bali n'abasaabaze.", ""], ["SALT-train-2152", "SALT sentence", "Disitulikiti ziyina ebyobulamu ebibi", "The districts have poor health care services."], ["SALT-train-5376", "SALT sentence", "Omuzikiti gugaddwa kati.", "The mosque is closed at this time."], ["SALT-train-6358", "SALT sentence", "Abatuuze baanenya omukulembeze waabwe olw'obukulembeze obubi.", "Residents blamed their leader for poor management."], ["SALT-train-6492", "SALT sentence", "Baateeka mu nkola ebirowoozo nga bwe ebyateesebwa abatuuze b'omu kitundu.", "They implemented the ideas as shared by the members of the society."], ["WIKI-04549-05", "Wikipedia: Henry Kajura", "Kajura yaweereza ng'Omubaka wa Paalamenti owa Bugahya County ku lw'ekibiina kya National Resistance Movement (NRM) okuva mu 1989 okutuuka mu 2006 , bweyawangulwa William Rwembera mu kalulu k'okusunsula anaakiikirira NRM mu ku londa kwa bonna ne kulwa Munisipaali y'e Hoima okuva mu 2011 okutuuka mu 2016, bwe yawangulwa mu kamyuufu oba akalulu ka NRM ak'okulaba ani anaakwatira ekibiina bendera mu kulonda kwa bonna, bweyawangulwa Lawrence Bategeka. Mu Paalamenti ey’omunaana okuva mu 2011 okutuuka mu 2016 yaweereza ng’Omubaka wa Paalamenti eyali amannyikiddwa mu ofiisi, olw’okulondebwa kwe mu kabineti. Mu Gwokubiri 2017 Kajura yalondebwa Solomon Gafabusa Iguru nga omuwabuzi wa Bunyoro Omukama ku nsonga z’olubiri .", ""], ["WIKI-00636-07", "Wikipedia: EBYOBUGAGGA BY'OMU TTAKA N'ENKULAAKULANA GYE BIREETA", "Olw'enkola ez'enjawulo ezikozesebwa mu kuyiikuula ebyobugagga bino gamba ng'amayinja, wabaawo okubwatuka n'okunyeenya ettaka era nga kino oluvannyuma kyandivaamu okubumbulukuka kw'ettaka ssaako okukosa obulamu bw'ebiramu ebiriraanyeewo n'ensonga endala eziringa ezo.", ""], ["SALT-train-18071", "SALT sentence", "Yunivasite etaddewo amateeka amapya agakwata ku bayizi abava mu nsi endala.", "The university has put up new rules for international students."], ["WIKI-05247-01", "Wikipedia: Jennifer Mwijukye", "Jennifer MwijukyeMunnayuganda Musuubuzi, Muvmbuzi, era yakuliraekibinja kya Unifreight.y'omu ka bantu abali mu kibinja kya Association of Uganda Freight Forwarders ne mukaseera kano akola nga omukulembeze wa Uganda Women Entrepreneurs Association Ltd (UWEAL).", ""], ["SALT-train-21307", "SALT sentence", "Ebyoya biyamba ebinnyonyi okufuna ebbugumu.", "Feathers help to keep birds warm."], ["SALT-train-15461", "SALT sentence", "Okutongozebwa kwalina kuba kwa byafaayo.", "The launch was supposed to be a milestone."], ["SALT-train-15482", "SALT sentence", "Poliisi yabalemesezza okwekalakaasa mu mirembe.", "Police denied them the right to demonstrate freely."], ["WIKI-00069-01", "Wikipedia: Reverse transcriptase", "Reverse transcriptase. Kino kirungo oba kiriisa ekiyamba entondeka (RNA) y’akawuka ka HIV eba mu nkula y’oluwuzi olumu RNA single stranded) okwekyusa n’efuuka ya wuuzi bbiri (double stranded DNA). DNA eyamba okuzimba obutoffaali obw’obulamu bw’ekintu kyonna omuli n’eky'akawuka HIV.", ""], ["WIKI-04182-04", "Wikipedia: Mohammed Hamid", "Mohammed omuto yakola ne mukulu we okutuusa ku ntandikwa y’emyaka gya 1990 lwe yatandika kkampuni ye eyasooka eya Pan Afric Commodities, nayo nga bizinensi y’okusuubula ebintu. Mu 1997, yagula yiika z'ettaka 15 (6.1 ha) e Kawempe, mu bitundu by’e Kampala, gye yasengula ebyuma n’atandika okukola eŋŋaano. Oluvannyuma yagula ebyum ala 256 abayimbi ba Uganda abasinga. Chris Evans asinga kuyimba mu lulimi oluzaaliranwa Oluganda. Bwe gwatuukira mu Gusooka 2014, yali afulumiza ennyimba kkumi omuli:", ""], ["WIKI-05520-05", "Wikipedia: Sitya Loss", "Mu Gwekuminebiri gwa 2015, Alex Sempijja omu ku bavubuka abaalagibwa ng’azina mu katambi yafuna ebisago eby’amaanyi bwe yali atambulira ku ddigi buleeki zaayo bwe zaalemererwa n’egwa mu mudumu. Patricia Nabakoza eyali amuwerekedde naye yafuna ebisago mu kabenje kano.", ""], ["SALT-train-6481", "SALT sentence", "Okuzzaamu amaanyi kkubo erizzaamu essuubi.", "Inspirations are a source of hope."], ["SALT-train-21045", "SALT sentence", "Nze ndowooza nti yunivasite zirina okuggulwawo.", "I think universities should be reopened."], ["SALT-train-22240", "SALT sentence", "Maama yamutuma emmugga okukima amazzi.", "Mother sent her to fetch water from the well."]];
const KEY="outside-check-v0.1";let ans={},i=0;
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}}
function done(){return Object.keys(ans).filter(k=>ans[k].verdict).length}
function show(){
 const it=ITEMS[i],a=ans[it[0]]||{};
 document.getElementById('count').textContent="Passage "+(i+1)+" of "+ITEMS.length+" - "+done()+" answered";
 document.getElementById('prog').style.width=(done()/ITEMS.length*100)+"%";
 const o=[["good","Good Luganda - fine to use as it is"],["fix","Needs fixing - usable after a correction"],["drop","Don't use - wrong, not Luganda, or not useful"]];
 document.getElementById('app').innerHTML='<div class="card"><div class="src">'+esc(it[1])+'</div><div class="lug">'+esc(it[2])+'</div>'+
 (it[3]?'<div class="eng">English: '+esc(it[3])+'</div>':'')+
 o.map(x=>'<label class="opt"><input type="radio" name="v" value="'+x[0]+'"'+(a.verdict==x[0]?' checked':'')+'> '+x[1]+'</label>').join('')+
 '<p>If it needs fixing, type the corrected Luganda:</p><textarea id="fix" rows="4">'+esc(a.fixed||"")+'</textarea>'+
 '<p>Note (optional):</p><input type="text" id="note" value="'+esc(a.note||"")+'"></div>'+
 '<button id="prev">Back</button><button class="p" id="next">'+(i==ITEMS.length-1?'Finish':'Save and next')+'</button> <button id="exp">Export CSV</button><button id="bak">Backup JSON</button>';
 document.getElementById('prev').onclick=()=>{keep();if(i>0){i--;show()}};
 document.getElementById('next').onclick=()=>{keep();if(i<ITEMS.length-1){i++;show()}else show()};
 document.getElementById('exp').onclick=()=>{keep();csv()};
 document.getElementById('bak').onclick=()=>{keep();dl("outside-check-backup-"+code()+".json",JSON.stringify(ans,null,1),"application/json")};
}
function keep(){const it=ITEMS[i],v=document.querySelector('input[name=v]:checked');
 ans[it[0]]={verdict:v?v.value:(ans[it[0]]||{}).verdict||"",fixed:document.getElementById('fix').value,note:document.getElementById('note').value};save();
 document.getElementById('count').textContent="Passage "+(i+1)+" of "+ITEMS.length+" - "+done()+" answered";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function code(){return (document.getElementById('who').value||"x").replace(/[^\w-]/g,"")}
function q(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function csv(){const r=[["id","source","luganda","english","verdict","corrected_luganda","note","reviewer"].join(",")];
 ITEMS.forEach(it=>{const a=ans[it[0]]||{};r.push([it[0],it[1],it[2],it[3],a.verdict||"",a.fixed||"",a.note||"",code()].map(q).join(","))});
 dl("outside-check-"+code()+"-"+new Date().toISOString().slice(0,10)+".csv","\ufeff"+r.join("\n"),"text/csv")}
function dl(n,t,m){const b=new Blob([t],{type:m+";charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click()}
show();
</script></body></html>
