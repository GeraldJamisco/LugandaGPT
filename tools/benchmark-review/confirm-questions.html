<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Confirm test questions</title><style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px;background:#14171c;color:#e6e8eb;line-height:1.5}
h1{font-size:1.3rem}h2{font-size:1.05rem;color:#7ea2ff;margin-top:28px}.muted{color:#9aa4b2;font-size:.9rem}
.card{background:#1e232b;border:1px solid #333b47;border-radius:10px;padding:14px;margin:10px 0}.card.done{border-left:4px solid #5fd39a}.card.chg{border-left:4px solid #f0b45a}
.q{font-size:1.08rem;white-space:pre-wrap}.guide{background:#222a3d;border-radius:8px;padding:10px;margin:10px 0;font-size:.92rem}
label{margin-right:18px;cursor:pointer}input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:8px;margin-top:8px;background:#12151a;color:#e6e8eb;border:1px solid #3a4452;border-radius:6px}
button{font:inherit;padding:10px 16px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #556;background:#262c36;color:#e6e8eb;cursor:pointer}button.p{background:#2f6fc4;border-color:#2f6fc4;color:#fff}
.top{position:sticky;top:0;background:#14171c;padding:8px 0;border-bottom:1px solid #333b47;z-index:2}
</style></head><body><h1>Confirm the 30 test questions</h1>
<p class="muted">These are the questions both AIs will answer in the blind test. Read each one. Tick "Fine" if it is good Luganda and a fair question, or "Needs change" and say what to change. Nothing leaves this computer.</p>
<div class="top">Your name or code: <input type="text" id="who" value="Group-1" style="width:10em;margin:0"> <span id="count" class="muted"></span> <button class="p" id="exp">Export CSV</button><button id="bak">Backup JSON</button></div>
<div id="app"></div>
<script>
const ITEMS=[["LGP-BENCH-EVERYDAY-001", "Everyday Luganda", "Nsisinkana mukwano gwange ku ssaawa ssatu ez'okumakya. Ssaawa eyo mu Luzungu ziba mmeka?", "Response states that ssaawa ssatu ez'okumakya is 9 in the morning. Stating 3am is wrong. Plural agreement for hours (ziba)."], ["LGP-BENCH-EVERYDAY-002", "Everyday Luganda", "Olukiiko lutandika ku ssaawa musanvu ez'emisana. Ssaawa eyo mu Luzungu ziba mmeka?", "Response in Luganda states that 'ssaawa musanvu ez'emisana' is 1 in the afternoon (13:00)."], ["LGP-BENCH-EVERYDAY-003", "Everyday Luganda", "Leero Lwakubiri. Enkya lujja kuba lunaku ki?", "Response in Luganda says tomorrow is Lwakusatu (Wednesday)."], ["LGP-BENCH-FORMAL-001", "Formal Luganda", "Wandiika ekiwandiiko ekitongole eky'okuyita abantu ku mwoleso gw'okuyamba abantu mu mbeera ey'amangu. Gunaaba ku Lwomukaaga, okuva ku ssaawa ssatu okutuuka ku ssaawa ttaano ez'okumakya, mu kizimbe ky'ekitundu.", "Formal notice in Luganda. Time numbers come first and the part of day last. Keeps Lwomukaaga and the Luganda times without changing them to English numbers. One consistent word for the event. Formal register."], ["LGP-BENCH-INSTRUCTION-001", "Instruction following", "Translate into Luganda: \"The tool library opens on Saturday from 9am to 1pm.\" Use the Luganda way of telling the time.", "Saturday is Lwomukaaga. Times are ssaawa ssatu ezokumakya okutuuka ku ssaawa musanvu ez'emisana."], ["LGP-BENCH-EXPLANATION-001", "Explanation", "Nnyonyola mu bufunze 'summary' kye ki, era mpa ekyokulabirako ekimu.", "Explains in Luganda (English technical term allowed) that a summary shortens a longer text to the key points, with one correct example."], ["LGP-BENCH-CODESWITCH-001", "Code-switching", "Nsaba onnyambe okuwandiika email eri boss wange nti nja kuba late ku meeting ya Lwokuna ku ssaawa ssatu ez'okumakya.", "Email in the same Luganda and English mix. Lwokuna and ssaawa ssatu ez'okumakya (9am) stay correct."], ["LGP-BENCH-EVERYDAY-004", "Everyday Luganda", "Okusoma kutandika ku ssaawa nnya ez'okumakya. Ssaawa eyo mu Luzungu ziba mmeka?", "States that ssaawa nnya ez'okumakya is 10 in the morning (10:00)."], ["LGP-BENCH-EVERYDAY-005", "Everyday Luganda", "Tulya ekyemisana ku ssaawa munaana ez'emisana. Ssaawa eyo mu Luzungu ziba mmeka?", "States that ssaawa munaana ez'emisana is 2 in the afternoon (14:00)."], ["LGP-BENCH-EVERYDAY-006", "Everyday Luganda", "Nninaayo okutuuka ku ssaawa bbiri ez'okumakya? Mu Luzungu ssaawa eyo eba ssaawa mmeka?", "Reverse direction. States that ssaawa bbiri ez'okumakya is 8 in the morning (8:00)."], ["LGP-BENCH-EVERYDAY-007", "Everyday Luganda", "Jjo lwabade Lwakutaano. Leero lunaku ki?", "Says today is Lwamukaaga (Saturday)."], ["LGP-BENCH-FORMAL-002", "Formal Luganda", "Wandiika ekiwandiiko ekitongole nti olukiiko olwali olwo ku Lwokuna lusenguddwa okudda ku Lwokutaano, ku ssaawa nnya ez'okumakya.", "Formal notice in Luganda that the Thursday meeting moved to Lwokutaano at ssaawa nnya ez'okumakya. Keeps days and Luganda time unchanged. Formal register. Adds no invented date or facts."], ["LGP-BENCH-FORMAL-003", "Formal Luganda", "Wandiika ebbaluwa ey'ekitiibwa eri omukulu w'essomero ng'osaba olukusa olwobutaberawo ku ssomero ku Lwokubiri.", "Formal letter in Luganda asking the head teacher for permission to be absent on Lwokubiri. Respectful register. Adds no invented facts."], ["LGP-BENCH-FORMAL-004", "Formal Luganda", "Wandiika ekiwandiiko ekitongole eky'okuyita abatuuze ku lukiiko lw'ekyalo ku Lwomukaaga ku ssaawa nnya ez'okumakya.", "Formal invitation notice. Keeps Lwomukaaga and ssaawa nnya ez'okumakya. Adds no invented date, venue or agenda."], ["LGP-BENCH-FORMAL-005", "Formal Luganda", "Wandiika ebbaluwa ey'okwebaza omuntu eyayamba ekibiina kyaffe mu mwoleso gw'ekitundu.", "Formal thank-you letter in Luganda to a person who helped the group at the community workshop. Respectful register."], ["LGP-BENCH-FORMAL-006", "Formal Luganda", "Wandiika ekiwandiiko ekitongole nti edduuka lijja kuggalwa ku Lwokutaano n'oLwomukaaga.", "Formal notice that the shop will be closed on Lwokutaano and Lwomukaaga. Days correct. Formal register."], ["LGP-BENCH-CODESWITCH-002", "Code-switching", "Nsaba onnyambe okuwandiika WhatsApp message eri friend wange nti meeting ya Lwokubiri ku ssaawa nnya ez'okumakya ereteddwa ku ssaawa mukaaga ez'emisana.", "Short friendly WhatsApp message in a natural Luganda-English mix. Keeps Lwokubiri, ssaawa nnya ez'okumakya (10am) and ssaawa mukaaga ez'emisana (noon) correct."], ["LGP-BENCH-CODESWITCH-003", "Code-switching", "Mpandiikira reply eri customer wange nti order ye egenda kutuuka Lwokuna.", "Short polite reply to a customer in a Luganda-English mix saying the order arrives Lwokuna. Does not invent other details."], ["LGP-BENCH-CODESWITCH-004", "Code-switching", "Nnyonyola 'deadline' kye ki nga bwe bwekikozebwa n'ekyokulabirako nga bwekikyogerwa.", "Explains what a deadline is, with an example, in a natural Luganda-English mix."], ["LGP-BENCH-CODESWITCH-005", "Code-switching", "Njagala okuwandiika text eri mukwano gwange nti nja kuba late kuba ndi mu traffic.", "Short text message in a Luganda-English mix saying the person will be late because of traffic."], ["LGP-BENCH-INSTRUCTION-003", "Instruction following", "Answer only in Luganda, in one short sentence: which day comes after Lwokuna?", "One short Luganda sentence saying Lwokutaano. Luganda only, one sentence."], ["LGP-BENCH-INSTRUCTION-004", "Instruction following", "List the days Lwokubiri, Lwokusatu and Lwokuna in Luganda order as a numbered list. Reply in Luganda only.", "Numbered list of three days in the correct order, in Luganda."], ["LGP-BENCH-INSTRUCTION-005", "Instruction following", "Translate into Luganda: \"The meeting starts at 10am on Wednesday.\" Use the Luganda way of telling the time.", "Luganda sentence with Wednesday as Lwokusatu and 10am as ssaawa nnya ez'okumakya."], ["LGP-BENCH-INSTRUCTION-006", "Instruction following", "Translate into Luganda: \"School starts at 8am.\" Use the Luganda way of telling the time. Give only the translation.", "Only the translation, with 8am as ssaawa bbiri ez'okumakya. No extra text."], ["LGP-BENCH-FACTUALITY-001", "Factuality and honesty", "Ekibuga ekikulu ekya Uganda kye ki?", "States Kampala. Short and correct."], ["LGP-BENCH-FACTUALITY-002", "Factuality and honesty", "Obudde bunaabeera butya e Kampala nga wayise wiiki bbiri?", "Says it cannot know the future weather and does not invent a forecast. May give general climate information."], ["LGP-BENCH-FACTUALITY-003", "Factuality and honesty", "Mpa ennyonyola y'ekitabo ekiyitibwa 'Omuzira w'e Bukoba' eky'omuwandiisi Namukasa.", "Does not invent a plot or details for a book it cannot verify. Says it does not know of this book."], ["LGP-BENCH-EXPLANATION-002", "Explanation", "Nnyonyola ensonga bbiri lwaki kikulu okutereka ssente buli mwezi.", "Explains exactly two reasons (ensonga bbiri) why saving money each month matters, in Luganda."], ["LGP-BENCH-EXPLANATION-003", "Explanation", "Nnyonyola email kye ki n'engeri gye bajikozesaamu.", "Explains in Luganda (English term allowed) what email is and how it is used, correctly and simply."], ["LGP-BENCH-EXPLANATION-004", "Explanation", "Nnyonyola lwaki abayizi balina okujja ku ssomero mu budde.", "Explains in Luganda why students should arrive at school on time, with sensible reasons."]],KEY="confirm-questions-v1";let ans={};
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const code=()=>(document.getElementById('who').value||"x").replace(/[^\w-]/g,"");
function count(){const n=ITEMS.filter(x=>(ans[x[0]]||{}).verdict).length;document.getElementById('count').textContent=n+" of "+ITEMS.length+" checked"}
let h="",cat="";ITEMS.forEach((it,n)=>{if(it[1]!=cat){cat=it[1];h+="<h2>"+esc(cat)+"</h2>"}
 const a=ans[it[0]]||{};
 h+='<div class="card '+(a.verdict=="fine"?"done":a.verdict=="change"?"chg":"")+'" id="c'+n+'"><div class="muted">'+(n+1)+". "+esc(it[0])+'</div><div class="q">'+esc(it[2])+'</div>'+
 '<div class="guide"><b>What a good answer must do:</b> '+esc(it[3])+'</div>'+
 '<label><input type="radio" name="v'+n+'" value="fine"'+(a.verdict=="fine"?" checked":"")+'> Fine</label><label><input type="radio" name="v'+n+'" value="change"'+(a.verdict=="change"?" checked":"")+'> Needs change</label>'+
 '<input type="text" id="n'+n+'" placeholder="What should change? (optional if Fine)" value="'+esc(a.note||"")+'"></div>'});
document.getElementById('app').innerHTML=h;
ITEMS.forEach((it,n)=>{const upd=()=>{const v=document.querySelector('input[name=v'+n+']:checked');ans[it[0]]={verdict:v?v.value:"",note:document.getElementById('n'+n).value};save();count();
 document.getElementById('c'+n).className="card "+(v?(v.value=="fine"?"done":"chg"):"")};
 document.querySelectorAll('input[name=v'+n+']').forEach(r=>r.onchange=upd);document.getElementById('n'+n).oninput=upd});
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
function dl(n,t,m){const b=new Blob([t],{type:m+";charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click()}
document.getElementById('exp').onclick=()=>{const r=[["item_id","category","prompt","verdict","note","reviewer"].join(",")];
 ITEMS.forEach(it=>{const a=ans[it[0]]||{};r.push([it[0],it[1],it[2],a.verdict||"",a.note||"",code()].map(q).join(","))});
 dl("confirm-questions-"+code()+"-"+new Date().toISOString().slice(0,10)+".csv","\ufeff"+r.join("\n"),"text/csv")};
document.getElementById('bak').onclick=()=>dl("confirm-questions-backup-"+code()+".json",JSON.stringify(ans,null,1),"application/json");
count();
</script></body></html>
