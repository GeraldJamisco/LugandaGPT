<script>
const TAG="p1-v0.3", ITEMS=[{"item_id": "LGP-BENCH-INSTRUCTION-003", "category": "instruction_following", "prompt": "Answer only in Luganda, in one short sentence: which day comes after Lwokuna?", "expected_behavior": "One short Luganda sentence saying Lwokutaano. Luganda only, one sentence.", "A": "Olunaku oluddako olwokuna lwe Lwokutaano.", "B": "Olunaku oludda lwakuna ye Lwokutaano."}, {"item_id": "LGP-BENCH-EVERYDAY-006", "category": "everyday_luganda", "prompt": "Nnina kutuuka ku ssaawa bbiri ez'okumakya? Mu Luzungu ssaawa eyo eba ssaawa mmeka?", "expected_behavior": "Reverse direction. States that ssaawa bbiri ez'okumakya is 8 in the morning (8:00).", "A": "Ssaawa bbiri ez'okumakya mu Luzungu ziba ssaawa 8:00 ez'oku makya.", "B": "Ssaawa bbiri ez'okumakya mu Luzungu zibeera 8:00am."}, {"item_id": "LGP-BENCH-FORMAL-001", "category": "formal_luganda", "prompt": "Wandiika ekiwandiiko ekitongole eky'okuyita abantu ku mwoleso gw'okuyamba abantu mu mbeera ey'amangu. Gunaaba ku Lwomukaaga, okuva ku ssaawa ssatu okutuuka ku ssaawa ttaano ez'okumakya, mu kizimbe ky'ekitundu.", "expected_behavior": "Formal notice in Luganda. Time numbers come first and the part of day last. Keeps Lwomukaaga and the Luganda times without changing them to English numbers. One consistent word for the event. Formal register.", "A": "EKIWANDIIKO: OKUYITA ABANTU KU MWOLESO GW'OKUYAMBA ABANTU MU MBEERA EY'AMANGU\n\nTubategeeza nti wajja kubaawo omwoleso gw'okuyamba abantu mu mbeera ey'amangu ku Lwomukaaga, okuva ku ssaawa ssatu okutuuka ku ssaawa ttaano ez'okumakya, mu kizimbe ky'ekitundu.\n\nOmwoleso guno gugendereddwa okusomesa abantu ku ngeri y'okuyambamu abo abali mu bwetaavu, okufuna obukugu mu bujjanjabi obusookerwako n'okugaba obuyambi. \n\nMujje tukolere wamu okuyamba abo abali mu mbeera embi. Muyite mwenna, ab'omu maka, ab'emikwano n'ab'ekitundu.", "B": "**Okuyita Abantu ku Mwoleso gw'Okuyamba Abantu mu Mbeera ey'Amangu**\n\nTukwaniriza ku mwoleso gw'okuyamba abantu mu mbeera ey'amangu ogugenda okubeera mu kizimbe ky'ekitundu ku Lwomukaaga, okuva ku ssaawa ssatu okutuuka ku ssaawa ttaano ez'okumakya.\n\nOmwoleso guno gujja kubaamu emisomo, emirimu gy'engalo, n'okugabana obubaka obukulu ku ngeri y'okuyamba abantu mu mbeera ey'amangu.\n\nTukusaba okujja n'okuyiga ebisingawo ku ngeri gy'oyinza okuyamba abalala mu mbeera ey'amangu.\n\nTukusaba okujja n'okuyamba okugabana obubaka n'ebikozesebwa n'abalala."}, {"item_id": "LGP-BENCH-INSTRUCTION-005", "category": "instruction_following", "prompt": "Translate into Luganda: \"The meeting starts at 10am on Wednesday.\" Use the Luganda way of telling the time.", "expected_behavior": "Luganda sentence with Wednesday as Lwokusatu and 10am as ssaawa nnya ez'okumakya.", "A": "Olukiiko lutandika ku ssaawa nnya ez'oku makya ku Lwokusatu.", "B": "Olukiiko lutandika ssaawa nnya ez'okumakya ku Lwokusatu."}, {"item_id": "LGP-BENCH-INSTRUCTION-006", "category": "instruction_following", "prompt": "Translate into Luganda: \"School starts at 8am.\" Use the Luganda way of telling the time. Give only the translation.", "expected_behavior": "Only the translation, with 8am as ssaawa bbiri ez'okumakya. No extra text.", "A": "Essomero litandika ku ssaawa bbiri ez'oku makya.", "B": "Essomero litandika ssaawa bbiri ez'okumakya."}, {"item_id": "LGP-BENCH-FORMAL-005", "category": "formal_luganda", "prompt": "Wandiika ebbaluwa ey'okwebaza omuntu eyayamba ekibiina kyaffe mu mwoleso gw'ekitundu.", "expected_behavior": "Formal thank-you letter in Luganda to a person who helped the group at the community workshop. Respectful register.", "A": "**Ebbaluwa ey'okwebaza**\n\n**Eri:** [Erinnya ly'omuntu eyayamba ekibiina kyaffe]\n\n**Okuva:** [Erinnya lyo]\n\n**Ebiro:** [Olunaku / mwezi / mwaka]\n\n**Omutwe:** Okwebaza olw'obuyambi bwo mu mwoleso gw'ekitundu\n\nNjagala okwebaza olw'obuyambi bwo obw'omuwendo mu mwoleso gw'ekitundu.\n\nObuyambi bwo bwaleetawo enjawulo mu buwanguzi bwaffe era bwatuyamba okulaga obukugu bwaffe obw'enjawulo.\n\nTusiima obuyambi bwo era tukusiima olw'okuyamba ekibiina kyaffe okutuuka ku buwanguzi.\n\n**N'obwesigwa,**\n\n**[Erinnya lyo]**\n\n**[Ekifo ky'obukulembeze]**\n\n**[Ekibiina kyaffe]**\n\n**[Olunaku / mwezi / mwaka]", "B": "Ebbaluwa ey'okwebaza \n\nMutebi, \nTukwebaza nnyo olw'okuyamba ekibiina kyaffe mu mwoleso gw'ekitundu. Obuyambi bwo bwali bwa mugaso nnyo era bwatuyamba okukola obulungi. Tukusiima nnyo olw'obuyambi bwo."}, {"item_id": "LGP-BENCH-FACTUALITY-002", "category": "factuality_uncertainty", "prompt": "Obudde bunaabeera butya e Kampala nga wayise wiiki bbiri?", "expected_behavior": "Says it cannot know the future weather and does not invent a forecast. May give general climate information.", "A": "Okubuulira obudde obutuufu e Kampala, nja kuba nsobola okukuwa amawulire g'obudde ng'ekirooto kyo kituukiridde.", "B": "Kampala, ekibuga ekirimu abantu abangi mu Uganda, embeera y'obudde esobola okukyuka buli kaseera.\n\nOkumanya obulungi embeera y'obudde ey'omu maaso, kikulu okukebera app y'obudde oba emikutu gy'amawulire egikwata ku mbeera y'obudde.\n\nNjagala nnyo okukuyamba mu ngeri endala yonna!"}, {"item_id": "LGP-BENCH-EVERYDAY-007", "category": "everyday_luganda", "prompt": "Jjo lwabade Lwakutaano. Leero lunaku ki?", "expected_behavior": "Says today is Lwamukaaga (Saturday).", "A": "Leero lunaku lwa **Mmande**, olunaku olusooka mu wiiki.", "B": "Leero Lwamukaaga."}, {"item_id": "LGP-BENCH-CODESWITCH-002", "category": "code_switching", "prompt": "Nsaba onnyambe okuwandiika WhatsApp message eri friend wange nti meeting ya Lwokubiri ku ssaawa nnya ez'okumakya ereteddwa ku ssaawa mukaaga ez'emisana.", "expected_behavior": "Short friendly WhatsApp message in a natural Luganda-English mix. Keeps Lwokubiri, ssaawa nnya ez'okumakya (10am) and ssaawa mukaaga ez'emisana (noon) correct.", "A": "Nsaba onyambe okutegeeza abanji nti olukiiko olwabadde lutegekeddwa ku Lwokubiri ssaawa nnya ez'okumakya, kati lutereddwa ku Lwokubiri ssaawa kkumi na bbiri ez'emisana", "B": "Nsuubira nti okyali bulungi! Nkakasa nti okyetaaga obuyambi bwonna mu kuteekateeka olukiiko lwo olwa buli Lwakubiri ku ssaawa mukaaga ez'emisana."}, {"item_id": "LGP-BENCH-FORMAL-003", "category": "formal_luganda", "prompt": "Wandiika ebbaluwa ey'ekitiibwa eri omukulu w'essomero ng'osaba olukusa olwobutaberawo ku ssomero ku Lwokubiri.", "expected_behavior": "Formal letter in Luganda asking the head teacher for permission to be absent on Lwokubiri. Respectful register. Adds no invented facts.", "A": "**Ebbaluwa ey'ekitiibwa eri omukulu w'essomero**\n\n**Erinnya:** John Smith  \n**Ettendekero:** St. Mary's High School  \n**Eddoboozi:** 0123456789\n\n**Nze John Smith, omuyizi mu siniya ey'okuna ku St. Mary's High School. Nsaba olukusa okuva ku ssomero ku Lwokubiri, nga 12 Ogwomusanvu, okujjanjabibwa olw'obulwadde obw'amangu.**\n\n**Njagala okukakasa nti nja kusigala nga nkwatagana n'abasomesa bange n'abakungu b'essomero mu kiseera ky'okuwona kwange.**\n\n**Nsuubira okufuna okuddibwamu okuva gyoli mu bwangu.**\n\n**Nneebaza olw'obuyambi bwonna.**\n\n**John Smith**", "B": "Ebbaluwa y'okusaba olukusa obutabaawo ku ssomero\n\nOmukulu w'essomero, \nNdiwandiikira okusaba kwange okubula ku ssomero ku Lwokubiri, nga [date]. Nina ensonga enkulu eziwerako ezenyinza okuleeta. \n\nNsaba ontegeere era onzikirize okusigala nga siri ku ssomero ku lunaku olwo. \n\nWebale nnyo olw'okutegeera."}, {"item_id": "LGP-BENCH-CODESWITCH-005", "category": "code_switching", "prompt": "Njagala okuwandiika text eri mukwano gwange nti nja kuba late kuba ndi mu traffic.", "expected_behavior": "Short text message in a Luganda-English mix saying the person will be late because of traffic.", "A": "Sijja kusobola okutuuka ku mulimu mu budde kubanga ndi mu traffic. Nsaba ontegeere era nsuubira tujja kusobola okusisinkana enkya ku makya", "B": "Mukwano gwange, nja kuba late kuba ndi mu traffic. Nsonyiwa olw'obutabaawo mu budde."}, {"item_id": "LGP-BENCH-FORMAL-004", "category": "formal_luganda", "prompt": "Wandiika ekiwandiiko ekitongole eky'okuyita abatuuze ku lukiiko lw'ekyalo ku Lwomukaaga ku ssaawa nnya ez'okumakya.", "expected_behavior": "Formal invitation notice. Keeps Lwomukaaga and ssaawa nnya ez'okumakya. Adds no invented date, venue or agenda.", "A": "EKIWANDIIKO: OKUYITA ABATUUZE KU LUKIIKO LWE KYALO\n\nTubategeeza nti waliwo olukiiko lw'ekyalo ku Lwomukaaga ku ssaawa nnya ez'okumakya. Olukiiko luno lujja kubaawo ku nsonga enkulu ez'ekyalo. Tubasaba mubeawo era mutegeerebwe. Mwebale nnyo.", "B": "**Ekiwandiiko eky'okuyita abatuuze ku lukiiko lw'ekyalo**\n\n**Ekitongole kya Greenfield Community Development Initiative**\n\n**Lwomukaaga, 25/10/2024, ssaawa nnya ez'okumakya**\n\nTukwaniriza n'essanyu ku lukiiko lw'ekyalo olw'omulundi guno, olugendereddwamu okukubaganya ebirowoozo ku nsonga z'ekitundu n'okukola enteekateeka z'okukulaakulanya ekitundu kyaffe.\n\nOlukiiko luno lujja kubaawo mu kisenge ky'olukiiko lw'ekyalo mu Greenfield Community Center. Tukusaba okujja n'ebirowoozo byo n'ebiteeso byo okuyamba okukulaakulanya ekitundu kyaffe.\n\nTukusaba okukakasa okubeerawo kwo ng'otuuse ku ssaawa nnya ez'okumakya. Tukusaba okutuukirira ofiisi yaffe ku 123 Main Street oba ku email: communitycenter@greenfield.org singa oba olina ekibuuzo kyonna.\n\nTukusuubira okubeerawo n'okukola enjawulo mu kitundu kyaffe.\n\n**Ekiteeso ky'olukiiko:**\n\n**1. Okwanjula n'okukkiriza abagenyi.**\n\n**2. Okukubaganya ebirowoozo ku nsonga z'ekitundu.**\n\n**3. Okukola enteekateeka z'okukulaakulanya ekitundu."}, {"item_id": "LGP-BENCH-CODESWITCH-004", "category": "code_switching", "prompt": "Nnyonyola 'deadline' kye ki nga bwe bwekikozebwa n'ekyokulabirako nga bwekikyogerwa.", "expected_behavior": "Explains what a deadline is, with an example, in a natural Luganda-English mix.", "A": "**Deadline**\n\n* **Kye ki?**  \n* **Deadline** kye kiseera ekiragiddwa omuntu w'alina okuba ng'amalirizza omulimu oba okukola ekintu.\n\n* **Kikozesebwa kitya?**  \n* **Deadline** ekozesebwa okuteekawo obudde obw'okumaliriza omulimu oba okukola ekintu.\n\n* **Kyakulabirako:**  \n* Singa omusomesa akuwa **deadline** ey'okuwaayo ekiwandiiko, olina okukikola mu budde obwo.\n\n* Singa olemwa, oyinza okufuna obubonero obutono oba okufiirwa omukisa gw'okukola ekintu.", "B": "Deadline ye ssaawa oba olunaku omulimu oba pulojekiti mwebasaanidde okumalirizibwa. Kitegeeza nti olina okumaliriza omulimu ogwo nga obudde tebunatuuka.\n\n<think>\n\n<\/think>\n\nOkugeza, singa omusomesa akugambye nti omulimu ogw'okuwandiika gujja kuggwa ku Lwakutaano ssaawa kkumi, kitegeeza nti olina okugumaliriza ku Lwakutaano ssaawa kkumi oba nga bukyaali."}, {"item_id": "LGP-BENCH-EXPLANATION-001", "category": "explanation_reasoning", "prompt": "Nnyonyola mu bufunze 'summary' kye ki, era mpa ekyokulabirako ekimu.", "expected_behavior": "Explains in Luganda (English technical term allowed) that a summary shortens a longer text to the key points, with one correct example.", "A": "**Summary**\n\n* Summary is a **brief, concise overview** of a larger text or idea.\n* It captures the **main points** without going into too much detail.\n\n**Example**\n\n* Summary of a story about a brave little girl who saved a village from a monster.\n* The girl used her **intelligence** and **courage** to defeat the monster, showing that **even the smallest person can have a big impact**.", "B": "Summary: Summary is a short explanation of something. It highlights the main points in a simple way.\n\nExample: A summary of a story might say: The story is about a boy who loses his toy, finds it, and learns to be more careful."}, {"item_id": "LGP-BENCH-EVERYDAY-001", "category": "everyday_luganda", "prompt": "Nsisinkana mukwano gwange ku ssaawa ssatu ez'okumakya. Ssaawa eyo mu Luzungu zibeera mmeka?", "expected_behavior": "Response states that ssaawa ssatu ez'okumakya is 9 in the morning. Stating 3am is wrong. Plural agreement for hours (zibeera).", "A": "Ssaawa ssatu ez'okumakya mu Luzungu zibeera 9:00am.", "B": "Ssaawa ssatu ez'okumakya mu Luzungu zibeera ssaawa 9:00 ez'oku makya."}, {"item_id": "LGP-BENCH-FACTUALITY-003", "category": "factuality_uncertainty", "prompt": "Mpa ennyonyola y'ekitabo ekiyitibwa 'Omuzira w'e Bukoba' eky'omuwandiisi Namukasa.", "expected_behavior": "Does not invent a plot or details for a book it cannot verify. Says it does not know of this book.", "A": "Omuzira w'e Bukoba kitabo kya Buganda ekyawandiikibwa Namukasa, ekikwata ku bulamu n'obuwangwa bw'abantu mu Buganda. Kigenda mu maaso n'engeri abantu gye baayolekaganamu n'okusoomoozebwa mu bulamu bwabwe obwa bulijjo, nga bwe balwana okusigala nga banywevu mu mpisa n'obuwangwa bwabwe.", "B": "Ekitabo 'Omuzira w'e Bukoba' ekyawandiikibwa Margaret Namukasa kyogera ku bulamu bw'omuwala omuto ayitibwa Nalongo eyava mu kyalo ekitonotono e Bukoba mu Buganda.\n\nKino kyaliwo mu kiseera ky'obufuzi bwa Idi Amin, era kyogera ku kusoomoozebwa okw'amaanyi abakyala kwe baayolekagana nakwo mu kiseera ekyo.\n\nNamukasa akozesa emboozi eno okulaga obugumu n'obuvumu bw'abakyala mu mbeera enzibu, era n'okulaga obukulu bw'okulwanirira eddembe lyabwe.\n\nEkitabo kino kirimu ebyafaayo eby'obuntu, eby'obuwangwa, n'ebifaananyi ebirungi, ekikifuula ekitabo eky'omugaso eri abasomi abanoonya okutegeera obulungi ebyafaayo bya Uganda n'ebizibu by'abakyala."}, {"item_id": "LGP-BENCH-FORMAL-006", "category": "formal_luganda", "prompt": "Wandiika ekiwandiiko ekitongole nti edduuka lijja kuggalwa ku Lwokutaano n'oLwomukaaga.", "expected_behavior": "Formal notice that the shop will be closed on Lwokutaano and Lwomukaaga. Days correct. Formal register.", "A": "Ebbaluwa eraga nti edduuka lijja kuggalwa ku Lwokutaano n'Olwomukaaga.\n\nKampuni ya XYZ Enterprises erangirira nti edduuka lyayo erya XYZ Shop erisangibwa ku Main Street mu kibuga New York lijja kuggalwa ku Lwokutaano n'Olwomukaaga okuva ku ssaawa 12:00 ez'oku makya.\n\nOkuggalawo kuno kujja kusobozesa okuddaabiriza n'okuteekawo ebintu ebipya mu dduuka.\n\nAbaguzi basabibwa okukyalira edduuka ku nnaku endala oba okukozesa enkola yaffe ey'okutuusa ebintu ku mulyango.\n\nTukkiriza okwetonda olw'obutabaawo kwaffe era tusuubira okuddamu okukola mu bbanga ttono.", "B": "EKIWANDIIKO: ESAAWA Z'OKUGGALAWO EDUUKA\n\nTubategeeza nti edduuka lijja kubeera nga  liggale ku Lwokutaano ne ku Lwomukaaga olw'ensonga enkulu. Mwebale nnyo olw'okutegeera."}, {"item_id": "LGP-BENCH-EXPLANATION-002", "category": "explanation_reasoning", "prompt": "Nnyonyola ensonga bbiri lwaki kikulu okutereka ssente buli mwezi.", "expected_behavior": "Explains exactly two reasons (ensonga bbiri) why saving money each month matters, in Luganda.", "A": "Kikulu okutereka ssente buli mwezi olw'ensonga bbiri:\n\n1. **Okugonjoola ebizibu by'ensimbi**: Ssente z'otereka buli mwezi zisobola okukuyamba okugonjoola ebizibu by'ensimbi ebiyinza okujjawo, gamba ng'ebisale by'eddwaliro, ebisale by'essomero, oba ebintu ebirala ebigwa bitalaze.\n\n2. **Okutuuka ku biruubirirwa byo eby'ensimbi**: Bw'otereka ssente buli mwezi, kikuyamba okutuuka ku biruubirirwa byo eby'ensimbi, gamba ng'okugula ennyumba, okutandikawo bizineesi, oba okwetegekera ebiseera byo eby'omu maaso eby'ensimbi.", "B": "Kikulu okutereka ssente buli mwezi kubanga kikuyamba okwetegekera ebiseera eby'omu maaso n'okutuukiriza ebiruubirirwa byo eby'ensimbi.\n\nEnsonga esooka, okutereka ssente buli mwezi kikuyamba okwetegekera ebiseera eby'omu maaso.\n\nEnsonga ey'okubiri, okutereka ssente buli mwezi kikuyamba okutuukiriza ebiruubirirwa byo eby'ensimbi."}, {"item_id": "LGP-BENCH-EVERYDAY-004", "category": "everyday_luganda", "prompt": "Okusoma kutandika ku ssaawa nnya ez'okumakya. Ssaawa eyo mu Luzungu zibeera mmeka?", "expected_behavior": "States that ssaawa nnya ez'okumakya is 10 in the morning (10:00).", "A": "Ssaawa nnya ez'okumakya mu Luzungu zibeera 10:00am.", "B": "Okusoma kutandika ku ssaawa nnya ez'okumakya, mu Luzungu zibeera **10:00 AM**."}, {"item_id": "LGP-BENCH-EXPLANATION-003", "category": "explanation_reasoning", "prompt": "Nnyonyola email kye ki n'engeri gye bajikozesaamu.", "expected_behavior": "Explains in Luganda (English term allowed) what email is and how it is used, correctly and simply.", "A": "Email (electronic mail) ye ngeri y'okusindika obubaka, ebiwandiiko, oba ebifaananyi ku ssimu oba kompyuta yo ng'okozesa yintaneeti.\n\nOkugeza, osobola okuwandiika email okubuulira mukwano gwo oba mukama wo ekintu, okusaba omulimu, oba okusindika ssente.\n\nEmail ekola ng'osindika obubaka ku yintaneeti okudda ku kompyuta oba essimu endala, ekikusobozesa okuwuliziganya n'abantu abali mu bifo eby'enjawulo.", "B": "**Email (Email)** kika kya **mawulire ag'oku mutimbagano** agasindikibwa okuva ku kompyuta emu okudda ku ndala okuyita ku **ntegeka y'ensi yonna eya email**.\n\n**Engeri gye bakozesaamu email**:\n\n* **Okuwuliziganya**: Abantu bakozesa email okuwuliziganya n'abantu abalala, nga mw'otwalidde n'okubagabira ebiwandiiko, ebifaananyi, oba vidiyo.\n* **Okukola bizineesi**: Bizineesi zikozesa email okukola bizineesi, nga mw'otwalidde n'okukola endagaano, okutunda, oba okukwasaganya pulojekiti.\n* **Okusaba n'okuddamu**: Abantu bakozesa email okusaba emirimu, okusaba ebintu, oba okuddamu ebibuuzo.\n* **Okugabana ebirowoozo**: Abayizi n'abayizi bakozesa email okugabana ebirowoozo ku misomo gyabwe, okukolera awamu ku pulojekiti, oba okutegeka enkiiko."}, {"item_id": "LGP-BENCH-CODESWITCH-003", "category": "code_switching", "prompt": "Mpandiikira reply eri customer wange nti order ye egenda kutuuka Lwokuna.", "expected_behavior": "Short polite reply to a customer in a Luganda-English mix saying the order arrives Lwokuna. Does not invent other details.", "A": "Customer wange omulunji, nkutegeeza nti Order yo tujja kugituusa ku Lwokuna. osobola okusuubira enkya ya leero oba enkya olw'okusatu. Webale nnyo olw'okulinda.", "B": "Ku lwange, nja kuba nsobola okutuukiriza obudde bwo obw'okutuuka ku Lwokuna. Nsaba ontegeeze singa wabaawo enkyukakyuka yonna mu budde bwo obw'okutuuka. Nsuubira nti buli kimu kigenda bulungi ku ludda lwo."}, {"item_id": "LGP-BENCH-CODESWITCH-001", "category": "code_switching", "prompt": "Nsaba onnyambe okuwandiika email eri boss wange nti nja kuba late ku meeting ya Lwokuna ku ssaawa ssatu ez'okumakya.", "expected_behavior": "Email in the same Luganda and English mix. Lwokuna and ssaawa ssatu ez'okumakya (9am) stay correct.", "A": "Nsonyiwa olw'okulwawo, naye nja kuba nzirayo emabega ku ssaawa ssatu ez'oku makya ku Lwokuna. Nsuubira nti kino tekikosa nteekateeka yo.", "B": "Subject: Notification of Late arrival for Thursday Meeting\n\nI am writing to inform you that I will arrive late for the Thursday meeting at 9 in the morning."}, {"item_id": "LGP-BENCH-EXPLANATION-004", "category": "explanation_reasoning", "prompt": "Nnyonyola lwaki abayizi balina okujja ku ssomero mu budde.", "expected_behavior": "Explains in Luganda why students should arrive at school on time, with sensible reasons.", "A": "Abayizi balina okujja ku ssomero mu budde kubanga kibayamba okwetegekera obulungi ebigezo, okugoberera enteekateeka y'essomo, n'okwewala okubuusibwa ebigezo.\n\nKino kibayamba okukola obulungi mu by'ensoma n'okukulaakulanya empisa ennungi ez'okubeera mu bantu.", "B": "Abayizi balina okujja ku ssomero mu budde basobole okufuna ebisomesebwa, okwenyigira mu bikolebwa, n'okukakasa nti bategeera bulungi ebyo ebisomesebwa. Kino kibayamba okukulaakulana mu by'ensoma, okussa ekitiibwa mu basomesa n'abakozi b'essomero, n'okukulaakulanya empisa ennungi ey'okubeerawo n'obuvunaanyizibwa."}, {"item_id": "LGP-BENCH-EVERYDAY-005", "category": "everyday_luganda", "prompt": "Tulya ekyemisana ku ssaawa munaana ez'emisana. Ssaawa eyo mu Luzungu zibeera mmeka?", "expected_behavior": "States that ssaawa munaana ez'emisana is 2 in the afternoon (14:00).", "A": "Ssaawa munaana ez'emisana mu Luzungu zibeera 2:00pm.", "B": "Tulya ekyemisana ku ssaawa munaana ez'emisana. Ssaawa eyo mu Luzungu zibeera mmeka?\n\n**Tulya ekyemisana ku ssaawa munaana e try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done=()=>ITEMS.filter(x=>(ans[x.item_id]||{}).choice).length;
const code=()=>(document.getElementById('who').value||"x").replace(/[^\w-]/g,"");
function head(){document.getElementById('count').textContent="Question "+(i+1)+" of "+ITEMS.length+" - "+done()+" answered";
 document.getElementById('prog').style.width=(done()/ITEMS.length*100)+"%"}
function show(){const it=ITEMS[i],a=ans[it.item_id]||{};head();
 const o=[["A","A is better"],["B","B is better"],["both_good","Both are good"],["both_bad","Both are bad"]];
 document.getElementById('app').innerHTML='<div class="card"><div class="muted">'+esc(it.category)+'</div><div class="q">'+esc(it.prompt)+'</div>'+
 (it.expected_behavior?'<div class="guide"><b>What a good answer must do:</b> '+esc(it.expected_behavior)+'</div>':'')+
 '<div class="ans"><b>Answer A</b><br>'+esc(it.A)+'</div><div class="ans"><b>Answer B</b><br>'+esc(it.B)+'</div>'+
 o.map(x=>'<label class="opt"><input type="radio" name="v" value="'+x[0]+'"'+(a.choice==x[0]?' checked':'')+'> '+x[1]+'</label>').join('')+
 '<p>Why? (optional)</p><input type="text" id="note" value="'+esc(a.note||"")+'"></div>'+
 '<button id="prev">Back</button><button class="p" id="next">'+(i==ITEMS.length-1?'Finish':'Save and next')+'</button> <button id="exp">Export CSV</button><button id="bak">Backup JSON</button>';
 document.getElementById('prev').onclick=()=>{keep();if(i>0)i--;show()};

 document.getElementById('exp').onclick=()=>{keep();csv()};
 document.getElementById('bak').onclick=()=>{keep();dl("blind-"+TAG+"-backup-"+code()+".json",JSON.stringify(ans,null,1),"application/json")}}
function keep(){const it=ITEMS[i],v=document.querySelector('input[name=v]:checked');
 ans[it.item_id]={choice:v?v.value:(ans[it.item_id]||{}).choice||"",note:document.getElementById('note').value};save();head()}
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
function csv(){const r=[["item_id","category","choice","note","reviewer"].join(",")];
 ITEMS.forEach(it=>{const a=ans[it.item_id]||{};r.push([it.item_id,it.category,a.choice||"",a.note||"",code()].map(q).join(","))});
 dl("blind-"+TAG+"-"+code()+"-"+new Date().toISOString().slice(0,10)+".csv","﻿"+r.join("\n"),"text/csv")}
function dl(n,t,m){const b=new Blob([t],{type:m+";charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click()}
